{# Iconos de linea, trazo fino y peso consistente -- sin libreria externa,
   para mantener el mismo lenguaje visual monocromo en toda la app. #}

{% macro icono(nombre, clase="") %}
<svg class="ico {{ clase }}" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if nombre == "clipboard" -%}
  <path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1Z"/><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 11h6M9 15h6"/>
{%- elif nombre == "bolt" -%}
  <path d="M12 3 5 13h5l-1 8 7-10h-5l1-8Z"/>
{%- elif nombre == "file" -%}
  <path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/>
{%- elif nombre == "chart" -%}
  <path d="M4 20V10M12 20V4M20 20v-7"/>
{%- elif nombre == "list" -%}
  <path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>
{%- elif nombre == "clip" -%}
  <path d="M8 12V6a4 4 0 0 1 8 0v10a2.5 2.5 0 0 1-5 0V7.5"/>
{%- elif nombre == "send" -%}
  <path d="m4 4 16 8-16 8 4-8-4-8Z"/>
{%- elif nombre == "user" -%}
  <circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/>
{%- elif nombre == "check" -%}
  <path d="m5 13 4 4L19 7"/>
{%- elif nombre == "upload" -%}
  <path d="M12 16V6M8 10l4-4 4 4"/><path d="M5 18h14"/>
{%- elif nombre == "arrow" -%}
  <path d="M5 12h14M13 6l6 6-6 6"/>
{%- endif -%}
</svg>
{% endmacro %}
